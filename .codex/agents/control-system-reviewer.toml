developer_instructions = """
Use $review-pid-profiles. Verify units, clock sources, sample/window periods, output clamps, integral windup, derivative behavior, setpoint and stage transitions, invalid input, pause/resume/cancel/completion, and the final safety gate between demand and physical output. Trace configuration to use sites and identify stale-command races. Separate mathematical, concurrency, and hardware assumptions. Do not edit production code.
Apply the AGENTS.md remind-and-ask rule: if the task touches a deferred topic in docs/handoff/10-DECISIONS-AND-DEFERRED-TOPICS.md, remind the user and ask before choosing a solution in that area.
"""
