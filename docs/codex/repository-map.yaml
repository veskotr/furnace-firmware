known_architecture_debt:
  - "ADR-0003/ADR-0004 accept future STM32 actuator/interlock authority, local SSR windowing, and a sequenced expiring control session with unconditional STOP; current ESP32 GPIO/window ownership remains implemented until validated migration"
  - sensor-data inhibit is direct at the heater boundary; GPIO latency and polarity still need hardware validation
  - coordinator one-shot timer directly inhibits when aggregate updates stop (F-054), but processor can restamp cached acquisitions and failed scans can earn recovery events (F-071); physical-sample freshness, mapping, and quorum need separate evidence
  - global mutable coordinator state spans tasks and callbacks
  - temperature-device cache fields are written by device manager and read by temperature processor without a coherent snapshot protocol (F-060)
  - worker acknowledgements exist on key stop paths; coordinator worker self-exit avoids the confirmed full-queue shutdown cycle (F-055), and temperature-processor shutdown destroys owned sensor devices after worker exit (F-056); device-manager mutation synchronization remains uncharacterized
  - dispatcher shutdown does not quiesce external producers (F-062), and device-manager updates can overlap temperature-device destruction/reuse (F-063)
  - disabled health monitoring and excluded legacy temperature monitoring retain unsafe lifecycle paths (F-065–F-067); they must not be enabled/revived without correction
  - furnace error events have no production subscriber
  - run indicator is disabled by default and refuses invalid or contactor-colliding GPIOs
  - temporary control inhibit protects checks made after pause/stop, but off-write failure is not latched/reported honestly (F-077), an admitted high GPIO write can follow off (F-074), telemetry can defer contactor-off (F-075), and cooling can retain demand (F-070)
  - user reports field settings match field-tests, which has no tracked sdkconfig; exact flashed source/configuration remain unverified
  - selected 2 MiB single-app partitioning lacks the logger's `storage` LittleFS partition (F-068)
  - profile soft-landing uses quadratic ease-out with extended ramp duration while HMI graph projection remains linear
  - valid downward cooling target can false-trip generic positive overshoot guard (F-076); permanent heater fault can coexist with coordinator RESUMED status (F-078)
  - user confirms current operating oven has no independent hardware protection and ESP32 checks are not certified safety functions; planned production hardware mechanisms are future work
  - heater local inhibit handles SSR GPIO failure; central fault state and HMI handling are deferred by ADR-0001
  - PID/heater now reject non-finite values; F-003 in-flight publication and broader coordinator state ownership remain unresolved
  - coordinator blocks profile start until configured sensor recovery, rejects expired aggregate at start, and pauses on invalid/silent data (F-054); sensor recovery cannot auto-resume its paused run (F-069), and STOP frees profile state before worker exit (F-072)
