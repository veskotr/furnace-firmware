dispatcher_contract: "Dispatcher-task re-entrant submissions execute inline; external submissions use the bounded command queue. Coordinator stop is queue-independent and uses direct inhibit, but a STOP wake can still let the control worker submit one final command (F-061); external-producer shutdown is also unquiesced (F-062)."
